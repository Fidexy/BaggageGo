# BaggageGO passenger demo — one command:
#
#   docker compose up
#   → http://localhost:8091/bggo/live      the board
#   → http://localhost:8091/bggo/<CODE>    one passenger's card (codes in tickets.md)
#
# The named volume is the board's state: scans and bag choices survive
# `docker compose down` / `up`, and are only lost with `docker compose down -v`.
# `docker compose restart demo` reloads the app without touching it.

services:
  demo:
    build: .
    image: baggagego:local
    ports:
      # Loopback only, like the systemd unit it replaced on this host: nginx-proxy-
      # manager runs in host networking, so its /bggo location reaches this port
      # through 127.0.0.1 and the demo is never published on the LAN or WAN.
      # BGGO_HOST_BIND=0.0.0.0 opens it up when that is actually wanted.
      # BGGO_HOST_PORT moves it aside (a second stack, or the old unit still up):
      #   BGGO_HOST_PORT=8095 docker compose up
      - "${BGGO_HOST_BIND:-127.0.0.1}:${BGGO_HOST_PORT:-8091}:8091"
    environment:
      # The board is open; the operator console is at /bggo/controls?k=<token>.
      # The token lives in the database, so print it with:
      #   docker compose run --rm demo python server_v1.py --controls-url
      BGGO_DB: /data/passengers.db
      BGGO_PORT: "8091"
    volumes:
      - bggo-data:/data
    restart: unless-stopped

volumes:
  bggo-data:
