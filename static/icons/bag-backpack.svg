  <!-- Backpack — 0.5 units.
       Narrower and taller than the handbag, handle and lid seam across the top:
       the rucksack profile, told by proportion rather than by extra parts. Two
       arcs on the shoulders read as ears at picker size, which is why it is not
       that; a small top loop read as a knob on a hat. -->
