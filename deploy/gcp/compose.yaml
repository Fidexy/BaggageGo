# The VM stack: the demo behind a TLS front, on a machine that owns the frozen
# hostname. Standalone on purpose — it is NOT an overlay of
# pitch-demo/docker-compose.yml, because here the demo must not publish a host
# port at all: Caddy is the only door.
#
#   cd /opt/baggagego && sudo docker compose up -d
#
# IMAGE and SITE_ADDRESS come from .env (see .env.example). Nothing else about
# the app changes: same image as local, same /data volume, same /bggo/... paths.

name: baggagego

services:
  demo:
    image: ${IMAGE:?set IMAGE in .env}
    restart: unless-stopped
    environment:
      BGGO_DB: /data/passengers.db
      BGGO_PORT: "8091"
    volumes:
      # The board's state, on the VM's disk. Survives `compose down`,
      # `compose up`, image updates and reboots; lost only with `down -v`.
      - bggo-data:/data
    expose:
      - "8091"          # reachable from the compose network, never from the internet

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Overridable so the stack can be dry-run on a laptop whose 80/443 are
      # already taken (the homelab's NPM is host-network):
      #   SITE_ADDRESS=http://localhost CADDY_HTTP_PORT=8088 CADDY_HTTPS_PORT=8443
      - "${CADDY_HTTP_PORT:-80}:80"     # HTTP-01 challenge + redirect to https
      - "${CADDY_HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data        # certificates live here — do not delete
      - caddy-config:/config
    depends_on:
      - demo

volumes:
  bggo-data:
  caddy-data:
  caddy-config:
